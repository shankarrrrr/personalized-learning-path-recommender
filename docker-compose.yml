# Production-ready docker-compose for the Personalized Learning Path Recommender.
# Brings up the FastAPI backend and the nginx-served frontend together.
#
# Usage:
#   GEMINI_API_KEY=xxx JWT_SECRET_KEY=xxx docker compose up --build
#
# The frontend talks to the backend via the host's exposed port (8000) by
# default; override VITE_API_BASE_URL for a different deployment URL.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_EXPIRE_MINUTES=10080
      - GEMINI_EMBED_RPM_LIMIT=55
      - GEMINI_EMBED_MAX_RETRIES=5
      - PYTHONUNBUFFERED=1
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser calls the backend through the host's mapped port.
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: learning-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
